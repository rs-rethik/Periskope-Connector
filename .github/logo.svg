<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Periskope Connector">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EDC78"/>
      <stop offset="1" stop-color="#0B7A5E"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- chat bubble -->
  <rect x="96" y="104" width="320" height="236" rx="56" fill="#fff"/>
  <polygon points="148,322 148,412 240,330" fill="#fff"/>
  <!-- periscope: two lenses joined by an offset tube -->
  <polyline points="340,162 242,162 242,282 172,282" fill="none" stroke="#0B7A5E" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="340" cy="162" r="24" fill="#fff" stroke="#0B7A5E" stroke-width="14"/>
  <circle cx="172" cy="282" r="24" fill="#fff" stroke="#0B7A5E" stroke-width="14"/>
</svg>
