<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7FD6"/>
      <stop offset="1" stop-color="#0D3F7E"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F6CC4"/>
      <stop offset="1" stop-color="#0D3F7E"/>
    </linearGradient>
  </defs>
  <!-- full bleed: the launcher draws its own shape; the artwork stays inside the safe zone -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(38.4 38.4) scale(0.85)">
    <!-- chat bubble -->
    <rect x="112" y="120" width="288" height="232" rx="64" fill="#fff"/>
    <path d="M168 336 L150 412 L240 346 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <!-- the P -->
    <path d="M212 300 V176 H256 a46 46 0 0 1 0 92 H212" fill="none" stroke="url(#ink)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- online -->
    <circle cx="392" cy="128" r="34" fill="#22C55E" stroke="#fff" stroke-width="14"/>
  </g>
</svg>
